<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Thamizhan - Slides</title>
    <style>
        /* பொதுவான ஸ்டைல்கள் */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            font-size: 24px;
        }

        .slider-container {
            max-width: 1000px;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
        }

        .slide {
            display: none; /* ஆரம்பத்தில் அனைத்து ஸ்லைடுகளும் மறைக்கப்பட்டிருக்கும் */
            width: 100%;
        }

        /* வெப் பேஜ் / டெஸ்க்டாப் வியூவிற்கான படங்கள் */
        .slide img {
            width: 100%;
            height: auto;
            max-height: 500px; /* டெஸ்க்டாப்பில் அதிகபட்ச உயரம் */
            object-fit: cover;
            display: block;
        }

        /* ஆக்டிவாக இருக்கும் ஸ்லைடை மட்டும் காட்ட */
        .slide.active {
            display: block;
        }

        /* --------------------------------------------------
           மொபைல் வியூவிற்கான பிரத்யேக மாற்றங்கள் (Responsive CSS)
           -------------------------------------------------- */
        @media screen and (max-width: 768px) {
            .slider-container {
                width: 95%;
                margin: 15px auto;
                box-shadow: none;
            }

            .slide img {
                width: 100% !important;
                height: auto !important;
                max-height: 250px; /* மொபைல் வியூவில் பெரிதாகத் தெரியாமல் இருக்க உயரம் குறைக்கப்படும் */
                object-fit: contain; /* படம் முழுமையாகத் தெரிய உதவும் */
            }
            
            header {
                font-size: 18px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        என் வலைத்தளம் - ஸ்லைடு காட்சி (Slideshow)
    </header>

    <div class="slider-container">
        <div class="slide active">
            <img src="Slide1.png" alt="Slide 1">
        </div>
        <div class="slide">
            <img src="Slide2.png" alt="Slide 2">
        </div>
        <div class="slide">
            <img src="Slide3.png" alt="Slide 3">
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // ஒவ்வொரு 3 விநாடிகளுக்கு ஒருமுறை ஸ்லைடு மாறும்
        setInterval(showNextSlide, 3000);
    </script>

</body>
</html>
