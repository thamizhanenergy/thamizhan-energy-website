<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  // உங்கள் Firebase கான்ஃபிகரேஷன் விவரங்கள்
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project.firebaseapp.com",
    databaseURL: "https://your-project-default-rtdb.firebaseio.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123:web:abc"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // டேட்டாவை நிகழ்நேரமாகக் கண்காணித்தல் (Real-time listener)
  database.ref('devices/1001').on('snapshot', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // மோட்டார் நிலை
      document.getElementById('motorStatusBadge').innerText = data.motorStatus == 1 ? "ON" : "OFF";
      
      // ட்ரை ரன் அலர்ட்
      if (data.dryRun == 1) {
        document.getElementById('dryRunStatus').innerText = "Dry Run Trip!";
      } else {
        document.getElementById('dryRunStatus').innerText = "Safe";
      }
    }
  });

  // மோட்டாரை மேனுவலாக ஆன்/ஆஃப் செய்ய
  function toggleMotor(state) {
    database.ref('devices/1001').update({
      manualMotor: state ? 1 : 0
    });
  }

  // ஆட்டோ / மேனுவல் மோட் மாற்ற
  function toggleMode(modeVal) {
    database.ref('devices/1001').update({
      autoMode: modeVal === 'auto' ? 1 : 0
    });
  }
</script>
