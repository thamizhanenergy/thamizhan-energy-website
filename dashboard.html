<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWLCW 1.0 டேஷ்போர்டு | தமிழன் எனர்ஜி சிஸ்டம்ஸ்</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f2027; color: #fff; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { background: #182832; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        header h1 { font-size: 20px; color: #00ff88; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: #1a2a32; padding: 20px; border-radius: 12px; border: 1px solid #283c48; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .card h3 { font-size: 16px; margin-bottom: 15px; color: #00ff88; border-bottom: 1px solid #283c48; padding-bottom: 8px; }

        .tank-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; }
        .water-tank { width: 110px; height: 160px; border: 4px solid #fff; border-radius: 10px; position: relative; overflow: hidden; background: #0f2027; }
        .water-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #0072ff, #00c6ff); transition: height 0.5s ease-in-out; }
        .tank-label { margin-top: 10px; font-size: 14px; font-weight: 700; color: #00ff88; }

        .status-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .status-item { display: flex; justify-content: space-between; align-items: center; background: #0f2027; padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1px solid #22333d; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-online { background: #1b5e20; color: #a5d6a7; }
        .badge-offline { background: #b71c1c; color: #ef9a9a; }
        .badge-active { background: #006064; color: #80deea; }
        .badge-safe { background: #0d47a1; color: #90caf9; }
        .badge-alert { background: #b71c1c; color: #ffccbc; }

        .control-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-control { background: #00ff88; color: #0f2027; padding: 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; }
        .btn-manual { background: #ff9800; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>தமிழன் எனர்ஜி சிஸ்டம்ஸ் - AWLCW 1.0 IoT டேஷ்போர்டு</h1>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h3>தொட்டியின் நீர் மட்டம் (Water Tank Status)</h3>
                <div class="tank-container">
                    <div class="water-tank">
                        <div class="water-fill" id="waterFill" style="height: 20%;"></div>
                    </div>
                    <div class="tank-label" id="tankLevelText">மட்டம்: ஆய்வு செய்கிறது...</div>
                </div>
            </div>

            <div class="card">
                <h3>சாதன நிலை & கட்டுப்பாடுகள்</h3>
                <ul class="status-list">
                    <li class="status-item">
                        <span>இயக்க முறை (Mode):</span>
                        <span class="badge badge-active" id="modeStatus">Auto Mode</span>
                    </li>
                    <li class="status-item">
                        <span>மோட்டார் நிலை:</span>
                        <span class="badge badge-offline" id="motorStatusBadge">OFF</span>
                    </li>
                    <li class="status-item">
                        <span>ட்ரை ரன் பாதுகாப்பு:</span>
                        <span class="badge badge-safe" id="dryRunStatus">Safe (பாதுகாப்பானது)</span>
                    </li>
                </ul>

                <div class="control-group">
                    <button class="btn-control" id="modeBtn" onclick="toggleMode()">மேனுவல் மோட்டுக்கு மாற்றுக (Switch to Manual)</button>
                    <button class="btn-control btn-manual" id="motorBtn" onclick="toggleMotor()" disabled>மோட்டாரை இயக்கவும் (Manual ON)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let espIP = "192.168.4.1"; // ESP32 IP முகவரியை இங்கே மாற்றவும்
        let isAuto = true;
        let isMotorOn = false;

        setInterval(fetchStatus, 2000);

        function fetchStatus() {
            fetch(`http://${espIP}/status`)
            .then(res => res.json())
            .then(data => {
                let fillDiv = document.getElementById('waterFill');
                let labelDiv = document.getElementById('tankLevelText');
                let motorBadge = document.getElementById('motorStatusBadge');
                let modeBadge = document.getElementById('modeStatus');
                let dryRunBadge = document.getElementById('dryRunStatus');
                let motorBtn = document.getElementById('motorBtn');
                let modeBtn = document.getElementById('modeBtn');

                // நீர் மட்ட கணக்கீடு (Low, Mid, High based on Pull-up pins: LOW = 0)
                if (data.high == 0) {
                    fillDiv.style.height = '100%';
                    labelDiv.innerText = "மட்டம்: ஹை (High - நிறைந்துள்ளது)";
                } else if (data.mid == 0) {
                    fillDiv.style.height = '60%';
                    labelDiv.innerText = "மட்டம்: மிட் (Mid - நடுத்தரம்)";
                } else if (data.low == 0) {
                    fillDiv.style.height = '25%';
                    labelDiv.innerText = "மட்டம்: லோ (Low - குறைவு)";
                } else {
                    fillDiv.style.height = '10%';
                    labelDiv.innerText = "மட்டம்: காலியாக உள்ளது";
                }

                // மோட்டார் நிலை
                isMotorOn = data.motor == 1;
                if (isMotorOn) {
                    motorBadge.innerText = "ON (இயங்குகிறது)";
                    motorBadge.className = "badge badge-online";
                    motorBtn.innerText = "மோட்டாரை நிறுத்தவும் (Turn OFF)";
                    motorBtn.style.background = "#f44336";
                } else {
                    motorBadge.innerText = "OFF (நிறுத்தப்பட்டுள்ளது)";
                    motorBadge.className = "badge badge-offline";
                    motorBtn.innerText = "மோட்டாரை இயக்கவும் (Turn ON)";
                    motorBtn.style.background = "#ff9800";
                }

                // ஆட்டோ / மேனுவல் நிலை
                isAuto = data.auto == 1;
                if (isAuto) {
                    modeBadge.innerText = "Auto Mode (தானியங்கி)";
                    modeBadge.className = "badge badge-active";
                    modeBtn.innerText = "மேனுவல் மோட்டுக்கு மாற்றுக";
                    motorBtn.disabled = true; // ஆட்டோ மோடில் மேனுவல் பட்டன் வேலை செய்யாது
                } else {
                    modeBadge.innerText = "Manual Mode (கைமுறை)";
                    modeBadge.className = "badge badge-alert";
                    modeBtn.innerText = "ஆட்டோ மோட்டுக்கு மாற்றுக";
                    motorBtn.disabled = false; // மேனுவல் மோடில் ஆன்/ஆஃப் செய்யலாம்
                }

                // ட்ரை ரன் பாதுகாப்பு அலர்ட்
                if (data.dryRun == 1) {
                    dryRunBadge.innerText = "Alert: Dry Run! (நீர் வரவில்லை)";
                    dryRunBadge.className = "badge badge-alert";
                } else {
                    dryRunBadge.innerText = "Safe (பாதுகாப்பானது)";
                    dryRunBadge.className = "badge badge-safe";
                }
            })
            .catch(err => console.log("Connection error with ESP32"));
        }

        function toggleMode() {
            let targetMode = isAuto ? "manual" : "auto";
            fetch(`http://${espIP}/mode?mode=${targetMode}`)
            .then(res => res.text())
            .then(() => fetchStatus());
        }

        function toggleMotor() {
            if (isAuto) {
                alert("தற்போது ஆட்டோ மோடில் உள்ளது. இயக்க மேனுவல் மோட்டுக்கு மாற்றவும்!");
                return;
            }
            let targetState = isMotorOn ? "off" : "on";
            fetch(`http://${espIP}/motor?state=${targetState}`)
            .then(res => res.text())
            .then(() => fetchStatus());
        }
    </script>
</body>
</html>
