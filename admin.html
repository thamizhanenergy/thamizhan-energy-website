<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அட்மின் மேனேஜ்மென்ட் | தமிழன் எனர்ஜி சிஸ்டம்ஸ்</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyAJwgnJhXAiqNGpnaN0vWOevBcofYR9uxE",
        authDomain: "thamizhan-energy-systems.firebaseapp.com",
        databaseURL: "https://thamizhan-energy-systems-default-rtdb.firebaseio.com",
        projectId: "thamizhan-energy-systems",
        storageBucket: "thamizhan-energy-systems.firebasestorage.app",
        messagingSenderId: "727924977035",
        appId: "1:727924977035:web:ab34a19d7bd3a65976538e",
        measurementId: "G-0MP2C3NZWK"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const database = firebase.database();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f4f8; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #0f2027; margin-bottom: 20px; }
        .panel { margin-bottom: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .btn { background: #00ff88; color: #0f2027; border: none; padding: 10px 20px; font-weight: 700; cursor: pointer; border-radius: 5px; font-size: 14px; }
        .btn:hover { background: #00cc6a; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #0f2027; color: white; }
        .del-btn { background: #ff5252; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .update-btn { background: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ அட்மின் தயாரிப்பு மேலாண்மை (Admin Product Manager)</h2>
        <div style="margin-bottom: 20px;"><a href="shop.html" style="color: #2196F3; font-weight: 600; text-decoration: none;">🛒 ஆன்லைன் ஸ்டோர் செல்ல (Go to Shop) ➔</a></div>

        <div class="panel">
            <h3>➕ புதிய தயாரிப்பைச் சேர்க்கவும்</h3>
            <input type="text" id="prodName" placeholder="தயாரிப்பு பெயர் (Model Name)">
            <input type="number" id="prodPrice" placeholder="விலை (Price ₹)">
            <input type="number" id="prodStock" placeholder="ஸ்டாக் அளவு (Stock Qty)">
            <input type="text" id="prodOffer" placeholder="ஆஃபர் டேக் (எ.கா: 20% OFF அல்லது Save ₹500)">
            <textarea id="prodSpecs" rows="2" placeholder="ஸ்பெசிஃபிகேஷன்ஸ் (கமா மூலம் பிரிக்கவும்: எ.கா: ஆட்டோமேட்டிக், 1 வருடம் உத்தரவாதம்)"></textarea>
            <button type="button" class="btn" id="addProductBtn">தயாரிப்பைச் சேமிக்கவும்</button>
        </div>

        <div class="panel">
            <h3>📦 தயாரிப்புகள் பட்டியல் & எடிட் (Manage Products)</h3>
            <table>
                <thead>
                    <tr>
                        <th>பெயர்</th>
                        <th>விலை (₹)</th>
                        <th>ஸ்டாக்</th>
                        <th>ஆஃபர்</th>
                        <th>ஸ்பெக்ஸ்</th>
                        <th>செயல் (Actions)</th>
                    </tr>
                </thead>
                <tbody id="adminProductsTable">
                    <tr><td colspan="6" style="text-align:center;">தரவுகள் லோட் ஆகிறது...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            loadProductsAdmin();

            // பட்டன் கிளிக் வேலை செய்யவில்லை என்ற சிக்கலைத் தவிர்க்க நேரடியாக Event Listener இணைக்கப்பட்டுள்ளது
            document.getElementById('addProductBtn').addEventListener('click', function() {
                let name = document.getElementById('prodName').value.trim();
                let price = document.getElementById('prodPrice').value.trim();
                let stock = document.getElementById('prodStock').value.trim();
                let offerTag = document.getElementById('prodOffer').value.trim();
                let specsText = document.getElementById('prodSpecs').value.trim();

                if (!name || !price || !stock) {
                    alert("தயாரிப்பு பெயர், விலை மற்றும் ஸ்டாக் அளவைக் கட்டாயம் நிரப்பவும்!");
                    return;
                }

                let newProduct = {
                    name: name,
                    price: Number(price),
                    discount: Number(price),
                    stock: Number(stock),
                    offerTag: offerTag,
                    img: "3.png",
                    specs: specsText ? specsText.split(',').map(s => s.trim()) : ["உத்தரவாதம் உள்ளது"]
                };

                // Firebase Realtime Database மற்றும் LocalStorage இரண்டிலும் சேமித்தல்
                database.ref('products').push(newProduct).then(() => {
                    // LocalStorage காமன் ஸ்டோரேஜிலும் சேர்த்துக்கொள்ளுதல்
                    let localProducts = JSON.parse(localStorage.getItem('adminProducts')) || [];
                    localProducts.push(newProduct);
                    localStorage.setItem('adminProducts', JSON.stringify(localProducts));

                    alert("புதிய தயாரிப்பு வெற்றிகரமாகச் சேர்க்கப்பட்டது!");
                    
                    // இன்புட் பாக்ஸ்களை காலியாக்குதல்
                    document.getElementById('prodName').value = '';
                    document.getElementById('prodPrice').value = '';
                    document.getElementById('prodStock').value = '';
                    document.getElementById('prodOffer').value = '';
                    document.getElementById('prodSpecs').value = '';
                }).catch((error) => {
                    alert("சேமிப்பதில் பிழை: " + error.message);
                });
            });
        });

        // தயாரிப்புகளை டேபிளில் ஏற்றுதல்
        function loadProductsAdmin() {
            database.ref('products').on('value', (snapshot) => {
                let data = snapshot.val();
                let products = [];

                if (data) {
                    products = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                } else {
                    // இயல்புநிலை தயாரிப்புகள்
                    products = [
                        {id: "p1", name: "AWLCP 1.0", price: 3999, discount: 3499, stock: 15, offerTag: "Save ₹500", img: "3.png", specs: ["ஆட்டோமேட்டிக் டேங்க் ஆன்/ஆஃப்", "ட்ரைடன் பாதுகாப்பு"]},
                        {id: "p2", name: "AWLCW 1.0", price: 5499, discount: 4999, stock: 10, offerTag: "WiFi Model", img: "3.png", specs: ["மொபைல் மூலம் ரிமோட் கண்ட்ரோல்", "ஒயர்டு சென்சார்கள்"]}
                    ];
                    database.ref('products').set(products);
                }

                // காமன் ஸ்டோரேஜில் பேக்கப் சேமித்தல்
                localStorage.setItem('adminProducts', JSON.stringify(products));

                let html = '';
                products.forEach((p, index) => {
                    let specsStr = p.specs ? p.specs.join(', ') : '';
                    html += `
                        <tr>
                            <td><input type="text" id="edName_${index}" value="${p.name}"></td>
                            <td><input type="number" id="edPrice_${index}" value="${p.price}" style="width:80px;"></td>
                            <td><input type="number" id="edStock_${index}" value="${p.stock}" style="width:60px;"></td>
                            <td><input type="text" id="edOffer_${index}" value="${p.offerTag || ''}"></td>
                            <td><textarea id="edSpecs_${index}" rows="1">${specsStr}</textarea></td>
                            <td>
                                <button type="button" class="update-btn" onclick="updateProd('${p.id}', ${index})">புதுப்பி</button>
                                <button type="button" class="del-btn" onclick="deleteProd('${p.id}')">நீக்கு</button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('adminProductsTable').innerHTML = html;
            });
        }

        // பழைய தயாரிப்பை எடிட் செய்து புதுப்பித்தல்
        function updateProd(id, index) {
            let name = document.getElementById(`edName_${index}`).value.trim();
            let price = Number(document.getElementById(`edPrice_${index}`).value);
            let stock = Number(document.getElementById(`edStock_${index}`).value);
            let offerTag = document.getElementById(`edOffer_${index}`).value.trim();
            let specsText = document.getElementById(`edSpecs_${index}`).value.trim();
            let specs = specsText ? specsText.split(',').map(s => s.trim()) : [];

            database.ref('products/' + id).update({
                name: name,
                price: price,
                discount: price,
                stock: stock,
                offerTag: offerTag,
                specs: specs
            }).then(() => {
                alert("தயாரிப்பு விவரங்கள் வெற்றிகரமாகப் புதுப்பிக்கப்பட்டன!");
            }).catch((error) => {
                alert("புதுப்பிப்பதில் பிழை: " + error.message);
            });
        }

        // தயாரிப்பை நீக்குதல்
        function deleteProd(id) {
            if (confirm("நிச்சயமாக இந்தத் தயாரிப்பை நீக்க விரும்புகிறீர்களா?")) {
                database.ref('products/' + id).remove().then(() => {
                    alert("தயாரிப்பு நீக்கப்பட்டது!");
                }).catch((error) => {
                    alert("நீக்குவதில் பிழை: " + error.message);
                });
            }
        }
    </script>
</body>
</html>
