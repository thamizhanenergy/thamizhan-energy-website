<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // Firebase அமைப்பு விவரங்கள் (Admin பக்கத்தில் உள்ளது போலவே இருக்க வேண்டும்)
  const firebaseConfig = {
    apiKey: "AIzaSyAJwgnJhXAiqNGpnaN0vWOevBcofYR9uxE",
    authDomain: "thamizhan-energy-systems.firebaseapp.com",
    databaseURL: "https://thamizhan-energy-systems-default-rtdb.firebaseio.com",
    projectId: "thamizhan-energy-systems",
    storageBucket: "thamizhan-energy-systems.firebasestorage.app",
    messagingSenderId: "727924977035",
    appId: "1:727924977035:web:ab34a19d7bd3a65976538e",
    measurementId: "G-0MP2C3NZWK"
  };

  // Firebase துவக்கம்
  if (!firebase.apps.length) { 
      firebase.initializeApp(firebaseConfig); 
  }
  const database = firebase.database();

  // பக்கங்கள் லோட் ஆனவுடன் Firebase-லிருந்து தயாரிப்புகளை (Products) எடுக்கும் பங்க்ஷன்
  document.addEventListener("DOMContentLoaded", function() {
      loadShopProductsFromFirebase();
  });

  function loadShopProductsFromFirebase() {
      const productsContainer = document.getElementById('shopProductsContainer'); // shop.html-ல் தயாரிப்புகள் காட்டப்படும் HTML ID-ஐ இங்கு குறிப்பிடவும்
      
      if (!productsContainer) return;

      // Firebase-ல் உள்ள 'products' டேட்டாவை நிகழ்நேரமாக (Real-time) பெறுதல்
      database.ref('products').on('value', (snapshot) => {
          let productsData = snapshot.val();
          let productsList = [];

          if (productsData) {
              // Firebase ஆப்ஜெக்ட்டை அரேவாக (Array) மாற்றுதல்
              productsList = Object.keys(productsData).map(key => ({ id: key, ...productsData[key] }));
          } else {
              // டேட்டா இல்லாவிட்டால் இயல்புநிலை (Default) தயாரிப்புகளைக் காட்டுதல்
              productsList = [
                  {id: "p1", name: "AWLCP 1.0", price: 3999, discount: 3499, stock: 15, offerTag: "Save ₹500", img: "3.png", specs: ["ஆட்டோமேட்டிக் டேங்க் ஆன்/ஆஃப்", "ட்ரைடன் பாதுகாப்பு", "1 வருடம் உத்தரவாதம்"]},
                  {id: "p2", name: "AWLCW 1.0", price: 5499, discount: 4999, stock: 10, offerTag: "WiFi Model", img: "3.png", specs: ["மொபைல் மூலம் ரிமோட் கண்ட்ரோல்", "ஒயர்டு சென்சார்கள்", "1 வருடம் உத்தரவாதம்"]},
                  {id: "p3", name: "AWLCWS 1.0", price: 7499, discount: 6999, stock: 8, offerTag: "Solar + WiFi", img: "3.png", specs: ["மேல் & கீழ் தொட்டி வயர்லெஸ் இணைப்பு", "சோலார் பவர் சப்போர்ட்", "1 வருடம் உத்தரவாதம்"]}
              ];
          }

          // LocalStorage-லும் பேக்கப் சேமித்துக்கொள்ளலாம்
          localStorage.setItem('shopProducts', JSON.stringify(productsList));

          // HTML-ல் தயாரிப்புகளை ரெண்டர் செய்தல் (Render)
          let html = '';
          productsList.forEach(p => {
              let specsHTML = p.specs ? p.specs.map(s => `<li>${s}</li>`).join('') : '';
              
              html += `
                  <div class="product-card" style="background:white; padding:20px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.05); margin-bottom:20px;">
                      <span class="offer-badge" style="background:#ff5252; color:white; padding:3px 8px; border-radius:4px; font-size:11px;">${p.offerTag || ''}</span>
                      <img src="${p.img || '3.png'}" alt="${p.name}" style="width:100%; height:150px; object-fit:contain; margin:10px 0;">
                      <h3>${p.name}</h3>
                      <p style="text-decoration:line-through; color:#888; font-size:13px;">₹${p.price}</p>
                      <p style="font-size:18px; font-weight:bold; color:#0f2027;">₹${p.discount || p.price}</p>
                      <p style="font-size:12px; color:${p.stock > 0 ? 'green' : 'red'}; font-weight:600;">
                          ${p.stock > 0 ? 'ஸ்டாக் உள்ளது (' + p.stock + ')' : 'ஸ்டாக் காலாவதி'}
                      </p>
                      <ul style="font-size:12px; padding-left:15px; margin:10px 0; color:#555;">
                          ${specsHTML}
                      </ul>
                      <button class="btn" onclick="addToCart('${p.id}', '${p.name}', ${p.discount || p.price})" ${p.stock <= 0 ? 'disabled style="background:gray; cursor:not-allowed;"' : ''}>
                          🛒 கார்ட்டில் சேர்
                      </button>
                  </div>
              `;
          });

          productsContainer.innerHTML = html;
      });
  }
</script>
